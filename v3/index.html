<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>A Study in Teak</title>
  <meta name="description" content="One room, drawn to be made: a study, a bedroom, a dressing room and a bathroom, every decision on one page.">
  <link rel="preload" href="fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hanken-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">
</head>
<body>
  <!-- the liquid field: fixed behind the hero, painted by hero.js; a CSS gradient stands in without WebGL -->
  <div class="field" aria-hidden="true"><canvas class="field-c"></canvas><div class="field-grain"></div></div>


  <!-- chrome: three fixed points, no bar -->
  <header class="chrome" aria-label="Site">
    <a class="wm" href="#overview" aria-label="A Study in Teak — home"><b>a&nbsp;study</b><span>in&nbsp;teak</span></a>
    <div class="switch" role="group" aria-label="Dimensions in drawings">
      <span class="switch-bar" aria-hidden="true"></span>
      <button data-dim="ft" type="button">FT·IN</button><button data-dim="mm" type="button">MM</button><button data-dim="off" type="button">OFF</button>
    </div>
    <nav class="stack" aria-label="Rooms"></nav>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="sheet">Menu</button>
  </header>
  <div class="sheet" id="sheet" aria-hidden="true"><nav class="sheet-in" aria-label="All sections"></nav></div>

  <main id="app">
    <section class="hero" aria-label="A Study in Teak">
      <h1 class="hero-t" aria-live="polite"></h1>
      <a class="badge" href="#rooms" aria-label="Scroll down">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <defs><path id="ring" d="M40 40 m-31 0 a31 31 0 1 1 62 0 a31 31 0 1 1 -62 0"/></defs>
          <text><textPath href="#ring" textLength="192">SCROLL DOWN · SCROLL DOWN ·</textPath></text>
          <g class="badge-mark" transform="translate(40 40)"><circle r="6.5" cx="-2.2"/><circle r="6.5" cx="2.2"/></g>
        </svg>
      </a>
    </section>
    <div id="page"></div>
  </main>
  <div class="cursor" aria-hidden="true"></div>
  <div id="lightbox" hidden></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="../data.js"></script>
  <script src="hero.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
