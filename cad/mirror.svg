.5" y2="2743" stroke="#1b1b1b" stroke-width="6"/></g><text x="320" y="39" font-size="2.2" text-anchor="middle" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">FRONT VIEW</text><g class="dk-dim"><g stroke="#8a3a22" stroke-width="0.13"><line x1="297.16" y1="159.72" x2="342.84" y2="159.72"/><line x1="298.66" y1="153.72" x2="298.66" y2="160.92"/><line x1="297.66" y1="160.72" x2="299.66" y2="158.72" stroke-width="0.3"/><line x1="341.34" y1="153.72" x2="341.34" y2="160.92"/><line x1="340.34" y1="160.72" x2="342.34" y2="158.72" stroke-width="0.3"/></g><text x="320" y="158.92" font-size="1.2" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-mm">1067 — 3 FT 6 IN</text><text x="320" y="158.92" font-size="1.2" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-in">3'-6" — 3 FT 6 IN</text></g><g class="dk-dim"><g stroke="#8a3a22" stroke-width="0.13"><line x1="348.34" y1="42.5" x2="348.34" y2="155.22"/><line x1="342.34" y1="44" x2="349.54" y2="44"/><line x1="347.34" y1="45" x2="349.34" y2="43" stroke-width="0.3"/><line x1="342.34" y1="153.72" x2="349.54" y2="153.72"/><line x1="347.34" y1="154.72" x2="349.34" y2="152.72" stroke-width="0.3"/></g><text x="347.54" y="98.86" font-size="1.3" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-mm" transform="rotate(-90 347.54 98.86)">2743 — 9 FT</text><text x="347.54" y="98.86" font-size="1.3" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-in" transform="rotate(-90 347.54 98.86)">9'-0" — 9 FT</text></g><line x1="18" y1="171.6" x2="168" y2="171.6" stroke="#1b1b1b" stroke-width="0.3"/><text x="80" y="170" font-size="1.7" text-anchor="start" fill="#b3261e" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">FRAME</text><text x="130" y="170" font-size="1.7" text-anchor="start" fill="#b3261e" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">GLASS</text><line x1="18" y1="177.2" x2="168" y2="177.2" stroke="#ddd" stroke-width="0.15"/><text x="18" y="175.6" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Centre</text><text x="80" y="175.6" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 ft 2½ in</text><text x="130" y="175.6" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 ft 0 in</text><line x1="18" y1="182.8" x2="168" y2="182.8" stroke="#ddd" stroke-width="0.15"/><text x="18" y="181.2" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Each wing</text><text x="80" y="181.2" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">10 in</text><text x="130" y="181.2" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">7½ in</text><line x1="18" y1="188.4" x2="168" y2="188.4" stroke="#ddd" stroke-width="0.15"/><text x="18" y="186.8" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Height</text><text x="80" y="186.8" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">9 ft 0 in</text><text x="130" y="186.8" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">8 ft 9½ in</text><line x1="18" y1="194" x2="168" y2="194" stroke="#ddd" stroke-width="0.15"/><text x="18" y="192.4" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Wings</text><text x="80" y="192.4" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">45° forward, fixed stop</text><line x1="18" y1="199.6" x2="168" y2="199.6" stroke="#ddd" stroke-width="0.15"/><text x="18" y="198" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Whole frame across</text><text x="80" y="198" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">3 ft 6 in</text><line x1="18" y1="205.2" x2="168" y2="205.2" stroke="#ddd" stroke-width="0.15"/><text x="18" y="203.6" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Stands off the wall</text><text x="80" y="203.6" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">8 in</text><line x1="18" y1="210.8" x2="168" y2="210.8" stroke="#ddd" stroke-width="0.15"/><text x="18" y="209.2" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Floor either side</text><text x="80" y="209.2" font-size="1.6" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">7½ in</text><text x="18" y="226" font-size="3.2" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.3" font-family="Helvetica, Arial, sans-serif">NOTES</text><line x1="18" y1="227.5" x2="238" y2="227.5" stroke="#1b1b1b" stroke-width="0.35"/><text x="18" y="230.8" font-size="1.7" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0.2" font-family="Helvetica, Arial, sans-serif">CONFIRMED</text><text x="18" y="238" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">CONFIRMED by the owner: wings at 45°, and the whole frame — wings angled — inside 3 ft 6 in across</text><text x="18" y="242.6" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   (the red dashed box). All three panels 9 ft tall, level with the wardrobes.</text><text x="18" y="247.2" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">FINAL: centre glass 2 ft 0 in; the wings take everything the 3 ft 6 in frame has left at 45° —</text><text x="18" y="251.8" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   about 7½ in of glass each. Only two things would give bigger wings: a slimmer frame (¾ in</text><text x="18" y="256.4" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   frame → about 9¼ in), or a steeper angle (60° → about 11¼ in).</text><text x="190" y="238" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">The wings need a fixed stop at 45°. Opened any flatter, the frame gets wider than 3 ft 6 in.</text><text x="190" y="242.6" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Hinges: two continuous piano hinges on the back, one at each joint, in the frame finish.</text><text x="190" y="247.2" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Free-standing, centred on the far wall. 7½ in of floor either side, clear of the folding</text><text x="190" y="251.8" font-size="1.55" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   end-bay doors, which come out only about 3 in at this depth. Frame finish still open.</text><g data-tb="1"><g stroke="#1b1b1b" stroke-width="0.3" fill="none"><rect x="300" y="239" width="112" height="50" fill="#fff"/>
