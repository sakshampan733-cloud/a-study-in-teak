ns-serif" class="dk-in" transform="rotate(-90 198.63 126.08)">18'-11" — RIGHT WALL</text></g><g class="dk-dim"><g stroke="#8a3a22" stroke-width="0.13"><line x1="42.83" y1="52.5" x2="42.83" y2="199.65"/><line x1="50.83" y1="54" x2="44.03" y2="54"/><line x1="41.83" y1="55" x2="43.83" y2="53" stroke-width="0.3"/><line x1="50.83" y1="198.15" x2="44.03" y2="198.15"/><line x1="41.83" y1="199.15" x2="43.83" y2="197.15" stroke-width="0.3"/></g><text x="42.03" y="126.08" font-size="1.6" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-mm" transform="rotate(-90 42.03 126.08)">5791 — LEFT WALL</text><text x="42.03" y="126.08" font-size="1.6" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-in" transform="rotate(-90 42.03 126.08)">19'-0" — LEFT WALL</text></g><g class="dk-dim"><g stroke="#8a3a22" stroke-width="0.13"><line x1="59.87" y1="125" x2="177.18" y2="125"/><line x1="61.37" y1="126.5" x2="61.37" y2="126.2"/><line x1="60.37" y1="126" x2="62.37" y2="124" stroke-width="0.3"/><line x1="175.68" y1="126.5" x2="175.68" y2="126.2"/><line x1="174.68" y1="126" x2="176.68" y2="124" stroke-width="0.3"/></g><text x="118.53" y="124.2" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-mm">4572 — AT THE PARTITION LINE</text><text x="118.53" y="124.2" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" class="dk-in">15'-0" — AT THE PARTITION LINE</text></g><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 160.44 54 L 200 53.2 L 206 53.2"/></g><circle cx="160.44" cy="54" r="0.45" fill="#1b1b1b"/><text x="207.6" y="53.8" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">WINDOW</text><text x="207.6" y="56.6" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">HARD INTO THE CORNER — NO RETURN</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 175.68 109 L 200 108.2 L 206 108.2"/></g><circle cx="175.68" cy="109" r="0.45" fill="#1b1b1b"/><text x="207.6" y="108.8" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">RIGHT WALL</text><text x="207.6" y="111.6" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PANELLING AND THE DRESSING DOOR</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 127 126.5 L 200 125.7 L 206 125.7"/></g><circle cx="127" cy="126.5" r="0.45" fill="#1b1b1b"/><text x="207.6" y="126.3" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PARTITION LINE</text><text x="207.6" y="129.1" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">SHELL REFERENCE ONLY · TO CONFIRM</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 175.68 168.95 L 200 168.15 L 206 168.15"/></g><circle cx="175.68" cy="168.95" r="0.45" fill="#1b1b1b"/><text x="207.6" y="168.75" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DRESSING DOOR</text><text x="207.6" y="171.55" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 FT 6 × 8 FT · OPENS IN, HINGED RIGHT</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 116.63 198.15 L 200 197.35 L 206 197.35"/></g><circle cx="116.63" cy="198.15" r="0.45" fill="#1b1b1b"/><text x="207.6" y="197.95" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">BED WALL</text><text x="207.6" y="200.75" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PARCHMENT</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 57.88 157.57 L 50 156.77 L 44 156.77"/></g><circle cx="57.88" cy="157.57" r="0.45" fill="#1b1b1b"/><text x="42.4" y="157.37" font-size="1.8" text-anchor="end" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">ENTRANCE</text><text x="42.4" y="160.17" font-size="1.45" text-anchor="end" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">POSITION TO CONFIRM</text><g stroke="#1b1b1b" stroke-width="0.13" fill="none"><path d="M 57.58 169 L 50 168.2 L 44 168.2"/></g><circle cx="57.58" cy="169" r="0.45" fill="#1b1b1b"/><text x="42.4" y="168.8" font-size="1.8" text-anchor="end" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">THE STEP</text><text x="42.4" y="171.6" font-size="1.45" text-anchor="end" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">KICKS OUT PAST THE DOOR · TO CONFIRM</text><text x="300" y="20" font-size="3.2" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.3" font-family="Helvetica, Arial, sans-serif">NOTES</text><line x1="300" y1="21.5" x2="380" y2="21.5" stroke="#1b1b1b" stroke-width="0.35"/><text x="300" y="24.8" font-size="1.7" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0.2" font-family="Helvetica, Arial, sans-serif">REVISION 2</text><text x="300" y="32" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">The room is not square. It widens about 2 in from the</text><text x="300" y="37.4" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   study wall to the bed wall — roughly half a degree.</text><text x="300" y="42.8" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Diagonals measured 24 ft 5 in and 23 ft 11 in.</text><text x="300" y="48.2" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Right wall — 13 ft 6 in to the door frame, 3 ft frame,</text><text x="300" y="53.6" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   2 ft 4 in return, overall 18 ft 11 in.</text><text x="300" y="59" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">The right wall is taken as the straight reference; the left</text><text x="300" y="64.4" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   wall carries the splay and the step.</text><text x="300" y="69.8" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Ceiling 9 ft 1 in, level throughout. The main room ceiling</text><text x="300" y="75.2" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   is plain, so the splay never shows from above.</text><text x="300" y="80.6" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Floor, marble border and skirting are laid. Skirting runs</text><text x="300" y="86" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   on three walls only: bed, left and right.</text><text x="300" y="91.4" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Every fitted piece to be built 15–20 undersize and scribed</text><text x="300" y="96.8" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   on site to the wall it actually meets.</text><text x="300" y="102.2" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Furniture, partition and joinery are NOT shown.</text><text x="300" y="107.6" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Bathroom and dressing lie beyond the right wall — to come.</text><g stroke="#1b1b1b" stroke-width="0.3" fill="none"><rect x="300" y="239" width="112" height="50" fill="#fff"/>
      <line x1="300" y1="253" x2="412" y2="253"/><line x1="300" y1="269" x2="412" y2="269"/>
      <line x1="300" y1="279" x2="412" y2="279"/><line x1="356" y1="269" x2="356" y2="289"/></g><text x="303" y="245.5" font-size="3.4" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.6" font-family="Helvetica, Arial, sans-serif">A STUDY IN TEAK</text><text x="303" y="250" font-size="1.9" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Particulars of the room</text><text x="303" y="259.5" font-size="3.4" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.3" font-family="Helvetica, Arial, sans-serif">THE ROOM AS BUILT</text><text x="303" y="265" font-size="2" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Shell plan · measured on site</text><text x="303" y="273" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">SCALE</text><text x="303" y="277" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">1:40 @ A3</text><text x="359" y="273" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DATE</text><text x="359" y="277" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">18.09.2026</text><text x="303" y="283" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">REV</text><text x="303" y="287" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 — right wall set out from the measured door frame</text><text x="359" y="283" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DWG</text><text x="359" y="287" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">AST-DR-000</text></svg>