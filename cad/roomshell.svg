 x1="59" y1="185.92" x2="59" y2="195.12"/><line x1="58" y1="194.92" x2="60" y2="192.92" stroke-width="0.3"/></g><text x="57.73" y="193.12" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">127 (5 IN) STEP</text><g stroke="#8a3a22" stroke-width="0.13"><line x1="164.54" y1="53.5" x2="164.54" y2="171.82"/><line x1="156.54" y1="55" x2="165.74" y2="55"/><line x1="163.54" y1="56" x2="165.54" y2="54" stroke-width="0.3"/><line x1="156.54" y1="139.34" x2="165.74" y2="139.34"/><line x1="163.54" y1="140.34" x2="165.54" y2="138.34" stroke-width="0.3"/><line x1="156.54" y1="154.58" x2="165.74" y2="154.58"/><line x1="163.54" y1="155.58" x2="165.54" y2="153.58" stroke-width="0.3"/><line x1="156.54" y1="170.32" x2="165.74" y2="170.32"/><line x1="163.54" y1="171.32" x2="165.54" y2="169.32" stroke-width="0.3"/></g><text x="163.74" y="97.17" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 163.74 97.17)">4217</text><text x="163.74" y="146.96" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 163.74 146.96)">762 DOOR</text><text x="163.74" y="162.45" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 163.74 162.45)">787</text><g stroke="#8a3a22" stroke-width="0.13"><line x1="173.54" y1="53.5" x2="173.54" y2="171.82"/><line x1="165.54" y1="55" x2="174.74" y2="55"/><line x1="172.54" y1="56" x2="174.54" y2="54" stroke-width="0.3"/><line x1="165.54" y1="170.32" x2="174.74" y2="170.32"/><line x1="172.54" y1="171.32" x2="174.54" y2="169.32" stroke-width="0.3"/></g><text x="172.74" y="112.66" font-size="1.6" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 172.74 112.66)">5766 — RIGHT WALL, 18 FT 11 IN</text><g stroke="#8a3a22" stroke-width="0.13"><line x1="42.86" y1="53.5" x2="42.86" y2="171.82"/><line x1="50.86" y1="55" x2="44.06" y2="55"/><line x1="41.86" y1="56" x2="43.86" y2="54" stroke-width="0.3"/><line x1="50.86" y1="170.32" x2="44.06" y2="170.32"/><line x1="41.86" y1="171.32" x2="43.86" y2="169.32" stroke-width="0.3"/></g><text x="42.06" y="112.66" font-size="1.6" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 42.06 112.66)">5791 — LEFT WALL, 19 FT 0 IN</text><g stroke="#8a3a22" stroke-width="0.13"><line x1="58" y1="111.5" x2="152.44" y2="111.5"/><line x1="59.5" y1="113" x2="59.5" y2="112.7"/><line x1="58.5" y1="112.5" x2="60.5" y2="110.5" stroke-width="0.3"/><line x1="150.94" y1="113" x2="150.94" y2="112.7"/><line x1="149.94" y1="112.5" x2="151.94" y2="110.5" stroke-width="0.3"/></g><text x="105.22" y="110.7" font-size="1.5" text-anchor="middle" fill="#8a3a22" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">4572 — 15 FT 0 IN AT THE PARTITION LINE</text><line x1="138.75" y1="55" x2="182" y2="36" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="138.75" cy="55" r="0.4" fill="#1b1b1b"/><text x="183" y="36.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">WINDOW</text><text x="183" y="38.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">HARD INTO THE CORNER — NO RETURN</text><line x1="150.94" y1="99" x2="182" y2="62" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="150.94" cy="99" r="0.4" fill="#1b1b1b"/><text x="183" y="62.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">RIGHT WALL</text><text x="183" y="64.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PANELLING AND THE DRESSING DOOR</text><line x1="150.94" y1="146.96" x2="182" y2="88" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="150.94" cy="146.96" r="0.4" fill="#1b1b1b"/><text x="183" y="88.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DRESSING DOOR</text><text x="183" y="90.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 FT 6 × 8 FT · OPENS IN, HINGED RIGHT</text><line x1="112" y1="113" x2="182" y2="114" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="112" cy="113" r="0.4" fill="#1b1b1b"/><text x="183" y="114.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PARTITION LINE</text><text x="183" y="116.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">SHELL REFERENCE ONLY · POSITION TO CONFIRM</text><line x1="103.7" y1="170.32" x2="182" y2="140" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="103.7" cy="170.32" r="0.4" fill="#1b1b1b"/><text x="183" y="140.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">BED WALL</text><text x="183" y="142.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">PARCHMENT · 15 FT 6 IN</text><line x1="56.7" y1="137.86" x2="54" y2="208" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="56.7" cy="137.86" r="0.4" fill="#1b1b1b"/><text x="55" y="208.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">ENTRANCE</text><text x="55" y="210.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">POSITION TO CONFIRM</text><line x1="56.46" y1="147" x2="54" y2="222" stroke="#1b1b1b" stroke-width="0.13"/><circle cx="56.46" cy="147" r="0.4" fill="#1b1b1b"/><text x="55" y="222.2" font-size="1.7" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">THE STEP — 5 IN</text><text x="55" y="224.5" font-size="1.45" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">THE LEFT WALL KICKS OUT PAST THE DOOR · POSITION TO CONFIRM</text><text x="300" y="20" font-size="3.2" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.3" font-family="Helvetica, Arial, sans-serif">NOTES</text><line x1="300" y1="21.5" x2="380" y2="21.5" stroke="#1b1b1b" stroke-width="0.35"/><text x="300" y="24.8" font-size="1.7" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0.2" font-family="Helvetica, Arial, sans-serif">REVISION 2</text><text x="300" y="32" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">The room is not square. It widens about 2 in from the</text><text x="300" y="37.4" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   study wall to the bed wall — roughly half a degree.</text><text x="300" y="42.8" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Diagonals measured 24 ft 5 in and 23 ft 11 in.</text><text x="300" y="48.2" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Right wall — 13 ft 6 in to the door frame, 3 ft frame,</text><text x="300" y="53.6" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   2 ft 4 in return, overall 18 ft 11 in.</text><text x="300" y="59" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">The right wall is taken as the straight reference; the left</text><text x="300" y="64.4" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   wall carries the splay and the step.</text><text x="300" y="69.8" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Ceiling 9 ft 1 in, level throughout. The main room ceiling</text><text x="300" y="75.2" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   is plain, so the splay never shows from above.</text><text x="300" y="80.6" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Floor, marble border and skirting are laid. Skirting runs</text><text x="300" y="86" font-size="1.75" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   on three walls only: bed, left and right.</text><text x="300" y="91.4" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Every fitted piece to be built 15–20 undersize and scribed</text><text x="300" y="96.8" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">   on site to the wall it actually meets.</text><text x="300" y="102.2" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Furniture, partition and joinery are NOT shown.</text><text x="300" y="107.6" font-size="1.75" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Bathroom and dressing lie beyond the right wall — to come.</text><g stroke="#1b1b1b" stroke-width="0.3" fill="none"><rect x="300" y="239" width="112" height="50" fill="#fff"/>
      <line x1="300" y1="253" x2="412" y2="253"/><line x1="300" y1="269" x2="412" y2="269"/>
      <line x1="300" y1="279" x2="412" y2="279"/><line x1="356" y1="269" x2="356" y2="289"/></g><text x="303" y="245.5" font-size="3.4" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.6" font-family="Helvetica, Arial, sans-serif">A STUDY IN TEAK</text><text x="303" y="250" font-size="1.9" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Particulars of the room</text><text x="303" y="259.5" font-size="3.4" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0.3" font-family="Helvetica, Arial, sans-serif">THE ROOM AS BUILT</text><text x="303" y="265" font-size="2" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">Shell plan · measured on site</text><text x="303" y="273" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">SCALE</text><text x="303" y="277" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">1:50 @ A3</text><text x="359" y="273" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DATE</text><text x="359" y="277" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">18.09.2026</text><text x="303" y="283" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">REV</text><text x="303" y="287" font-size="1.8" text-anchor="start" fill="#1b1b1b" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">2 — right wall set out from the measured door frame</text><text x="359" y="283" font-size="1.5" text-anchor="start" fill="#666" font-weight="400" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">DWG</text><text x="359" y="287" font-size="2.1" text-anchor="start" fill="#1b1b1b" font-weight="700" letter-spacing="0" font-family="Helvetica, Arial, sans-serif">AST-DR-001</text></svg>