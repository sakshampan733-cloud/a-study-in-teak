<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Study in Teak</title>
  <meta name="description" content="Every decision for one room — a study, a bedroom, a dressing room and a bathroom — on one page.">
  <link rel="preload" href="fonts/cond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav" aria-label="Site">
    <a class="pill" href="#rooms">Begin</a>
    <button class="pill is-menu" type="button" aria-expanded="false" aria-controls="menu"><span class="pill-label">Menu</span><span class="burger" aria-hidden="true"></span></button>
  </nav>

  <main id="app">
    <section class="hero" data-intro="pending" aria-label="A Study in Teak">
      <div class="hero-curtain" aria-hidden="true"></div>
      <div class="hero-bg" aria-hidden="true">
        <video class="hero-video" muted loop playsinline preload="none" poster="media/hero-poster.jpg">
          <source data-src="media/hero.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero-in">
        <div class="hero-logo" data-intro-logo>
          <svg class="hero-mark" viewBox="0 0 64 64" aria-hidden="true"></svg>
          <div class="hero-word">A Study in Teak</div>
        </div>
        <div class="hero-flank is-left"><div data-intro-text>Particulars of the room</div></div>
        <div class="hero-flank is-right"><div data-intro-text>One veneer, everywhere</div></div>
        <div class="hero-copy">
          <h1>
            <span data-intro-text data-line-lock>A study, a bedroom, a dressing room.</span>
            <span data-intro-text data-line-lock>One teak desk sets the tone.</span>
          </h1>
          <p data-intro-text data-line-lock>Every decision on one page.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="../data.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/ScrambleTextPlugin.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
